name: CI

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

jobs:
    tests:
        name: "Tests · PHP ${{ matrix.php }} · Symfony ${{ matrix.symfony }} · ${{ matrix.dependencies }}"
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.2', '8.3', '8.4']
                symfony: ['7.4.*', '8.0.*']
                dependencies: ['highest']
                exclude:
                    # Symfony 8.0 requires PHP 8.4+.
                    - php: '8.2'
                      symfony: '8.0.*'
                    - php: '8.3'
                      symfony: '8.0.*'
                include:
                    # Lowest supported dependency set.
                    - php: '8.2'
                      symfony: '7.4.*'
                      dependencies: 'lowest'
                    # Latest PHP against the current Symfony major.
                    - php: '8.5'
                      symfony: '8.0.*'
                      dependencies: 'highest'
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, hash, json, tokenizer, xml
                  coverage: none
                  tools: flex

            - name: Validate composer.json
              run: composer validate --strict --no-check-lock

            - name: Install dependencies
              uses: ramsey/composer-install@v3
              with:
                  dependency-versions: ${{ matrix.dependencies }}
              env:
                  SYMFONY_REQUIRE: ${{ matrix.symfony }}

            - name: Run atoum test suite
              run: composer test-no-coverage

    static-analysis:
        name: Static analysis
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: dom, hash, json, tokenizer, xml
                  coverage: none

            # PHPStan is run against the highest supported stack (Symfony 8).
            - name: Install dependencies
              uses: ramsey/composer-install@v3
              with:
                  dependency-versions: highest

            - name: Run PHPStan
              run: composer phpstan

    coding-standards:
        name: Coding standards
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: dom, hash, json, tokenizer, xml
                  coverage: none

            - name: Install dependencies
              uses: ramsey/composer-install@v3
              with:
                  dependency-versions: highest

            - name: Check coding standards
              run: composer cs-check
